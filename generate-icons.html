<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<br>
<a id="dl192" download="icon-192.png">Download 192</a> |
<a id="dl512" download="icon-512.png">Download 512</a>

<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  const r = s * 0.2;

  // Background
  ctx.fillStyle = '#2c5282';
  roundRect(ctx, 0, 0, s, s, r);
  ctx.fill();

  // EKG line
  ctx.strokeStyle = 'white';
  ctx.lineWidth = s * 0.05;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  const pts = [
    [0.1, 0.5], [0.28, 0.5], [0.34, 0.28], [0.43, 0.72],
    [0.53, 0.36], [0.59, 0.62], [0.68, 0.5], [0.9, 0.5]
  ];
  ctx.moveTo(pts[0][0]*s, pts[0][1]*s);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0]*s, pts[i][1]*s);
  ctx.stroke();

  document.getElementById('dl'+s).href = canvas.toDataURL('image/png');
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

drawIcon(document.getElementById('c192'));
drawIcon(document.getElementById('c512'));
</script>
</body>
</html>
